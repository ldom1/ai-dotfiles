# ~/.tmux.conf — opensessions sidebar on the left, terminal panes on the right.
# Reload: prefix + r

# --- Basics ---------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB:clipboard"
set -g escape-time 0            # no lag on Esc (Claude Code, vim)
set -g focus-events on
set -g extended-keys on         # shift+enter etc. reach the agents
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
setw -g mode-keys vi

# --- Copy: select with the mouse = copied ---------------------------------
# OSC 52 to the terminal (set-clipboard), plus copy-command on native Linux (aif-platform copy,
# set in tmux-platform-linux.conf). Platform-specific settings: config/tmux-platform-*.conf.
set -g set-clipboard on
set -s command-alias[99] 'aif-copy=send -X copy-pipe-and-cancel ; display-message -d 1500 "Copied to clipboard"'
bind -T copy-mode-vi MouseDragEnd1Pane aif-copy
bind -T copy-mode-vi DoubleClick1Pane  select-pane \; send -X select-word \; aif-copy
bind -n DoubleClick1Pane select-pane \; copy-mode -M \; send -X select-word \; aif-copy
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y aif-copy
# Right click = paste (as in Windows Terminal); in the sidebar, a menu for the current session
bind -n MouseDown3Pane if -F '#{==:#{pane_current_command},opensessions-sidebar}' {
  display-menu -O -T "#[align=centre] #S " -x M -y M \
    "Rename session" r { command-prompt -I "#S" -p "Rename session:" { rename-session -- "%%" } } \
    "New session" n aif-new-session \
    "Kill session" x aif-kill-session \
    "" \
    "Hide sidebar" h aif-toggle-sidebar
} {
  paste-buffer -p
}

# --- Layout: opensessions sidebar on the left, terminal panes on the right ---
# Sidebar config: ~/.config/opensessions/config.json. prefix o t toggles it, Alt+s focuses it.
set -g detach-on-destroy off    # closing a session moves to another one
# A session created without a name (plain `tmux`) is named after its folder, not 0, 1, 2...
set-hook -g after-new-session 'run -b "sh ~/ai-dotfiles/config/tmux-name-session.sh \"#{session_name}\" \"#{session_path}\""'
set -g @opensessions-focus-global-key 'M-s'
# opensessions starts hidden on each tmux server: show it on attach unless a sidebar is already there.
set-hook -g client-attached 'run -b "sh ~/ai-dotfiles/config/tmux-sidebar-on.sh"'

# Actions, defined once as command aliases, bound below to Ctrl+Shift+key and prefix+key.
# Windows Terminal reaches them through user-keys (tmux-platform-wsl.conf), Ghostty through
# extended keys (CSI u, config/ghostty/config). The splits do nothing in the sidebar pane.
set -s command-alias[100] 'aif-split-right=if -F "#{!=:#{pane_current_command},opensessions-sidebar}" { split-window -h -c "#{pane_current_path}" }'
set -s command-alias[101] 'aif-split-below=if -F "#{!=:#{pane_current_command},opensessions-sidebar}" { split-window -v -c "#{pane_current_path}" }'
# Close the current pane; asks first when an agent (claude) runs in it. Nothing in the sidebar.
set -s command-alias[105] 'aif-kill-pane=if -F "#{!=:#{pane_current_command},opensessions-sidebar}" { if -F "#{==:#{pane_current_command},claude}" { confirm-before -p "Close this pane? The agent stops. (y/n)" kill-pane } { kill-pane } }'
# Kill the current session (asks first), move to another one, save now so it is not restored
set -s command-alias[102] 'aif-kill-session=confirm-before -p "Kill session #S? (y/n)" { kill-session ; run-shell -b "~/.tmux/plugins/tmux-resurrect/scripts/save.sh quiet" }'
# New session from a folder picker (opensessions sessionizer, fzf) in a popup
set -s command-alias[103] 'aif-new-session=display-popup -E -w 80% -h 60% "~/.tmux/plugins/opensessions/apps/tui/scripts/sessionizer.sh"'
set -s command-alias[104] 'aif-toggle-sidebar=run-shell "sh ~/.tmux/plugins/opensessions/integrations/tmux-plugin/scripts/toggle.sh"'
set-environment -g SESSIONIZER_DIR "$HOME"
set-environment -g SESSIONIZER_MAXDEPTH 2

bind -n C-S-o aif-split-right
bind -n C-S-e aif-split-below
bind -n C-S-x aif-kill-pane
bind -n C-S-k aif-kill-session
bind -n C-S-n aif-new-session
bind -n C-S-b aif-toggle-sidebar
# prefix + key: same actions, in any terminal
bind O aif-split-right
bind E aif-split-below
bind X aif-kill-session
bind N aif-new-session
bind B aif-toggle-sidebar
# Save every session, then quit tmux (no terminal intercepts prefix Q)
bind Q confirm-before -p "Save all sessions and quit tmux? (y/n)" \
  "run-shell '~/.tmux/plugins/tmux-resurrect/scripts/save.sh quiet' ; kill-server"
bind Tab switch-client -l
bind / list-keys -N    # tmux's own key help

# Platform layer (WSL or native Linux): copy, terminal features, terminal keys
run-shell 'tmux source-file ~/ai-dotfiles/config/tmux-platform-$(~/ai-dotfiles/bin/aif-platform name).conf'

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display "reloaded"

# No prefix: Alt+arrows move, Alt+z zoom, Alt+1..9 windows
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
bind -n M-z     resize-pane -Z
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
# prefix + Alt+arrows resize
bind -r M-Left  resize-pane -L 5
bind -r M-Right resize-pane -R 5
bind -r M-Up    resize-pane -U 3
bind -r M-Down  resize-pane -D 3

# --- Look: dark, flat, one accent ----------------------------------------
# palette: bg #11131a  surface #1c1f2a  muted #5c6370  text #c8ccd4  accent #7aa2f7  ok #9ece6a
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#11131a,fg=#5c6370"
set -g status-left-length 40
set -g status-left "#[fg=#11131a,bg=#7aa2f7,bold] #S #[bg=#11131a] "
set -g status-right "#[fg=#5c6370]#{?client_prefix,#[fg=#9ece6a]● PREFIX ,}#{?window_zoomed_flag,#[fg=#7aa2f7]◆ ZOOM ,}#[fg=#5c6370]%H:%M "
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[fg=#c8ccd4,bg=#1c1f2a,bold] #I #W "
setw -g window-status-separator ""
setw -g automatic-rename on
# Window name = folder of the active pane; unchanged while the sidebar has the focus
setw -g automatic-rename-format "#{?#{==:#{pane_current_command},opensessions-sidebar},#{window_name},#{b:pane_current_path}}"

# Pane borders: thin, title on top, active one in accent
setw -g pane-border-lines single
setw -g pane-border-status top
# No title above the sidebar: it draws its own header
setw -g pane-border-format "#{?#{==:#{pane_current_command},opensessions-sidebar},, #{?pane_active,#[fg=#7aa2f7 bold],#[fg=#5c6370]}#P #{pane_current_command} #[fg=#5c6370]#{b:pane_current_path} }"
setw -g pane-border-style "fg=#2a2e3b"
setw -g pane-active-border-style "fg=#7aa2f7"

set -g message-style "bg=#1c1f2a,fg=#c8ccd4"
setw -g mode-style "bg=#7aa2f7,fg=#11131a"
set -g display-panes-active-colour "#7aa2f7"
set -g display-panes-colour "#5c6370"

# --- Bell: an agent that waits rings the terminal (taskbar flash) ---------
setw -g monitor-bell on
set -g bell-action any
set -g visual-bell off
set-hook -g alert-bell 'if -F "#{==:#{session_attached},0}" "run -b \"sh ~/ai-dotfiles/config/tmux-bell-relay.sh\""'

# --- Plugins (TPM: prefix I installs, prefix U updates) --------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'Ataraxy-Labs/opensessions'
# Save the layout every 15 min, restore it when the tmux server starts. Processes are not kept.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @resurrect-hook-post-save-layout 'sh ~/ai-dotfiles/config/tmux-resurrect-sidebar.sh save'
set -g @resurrect-hook-post-restore-all 'sh ~/ai-dotfiles/config/tmux-resurrect-sidebar.sh restore'
run '~/.tmux/plugins/tpm/tpm'
