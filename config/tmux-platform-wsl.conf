# WSL + Windows Terminal. Chargé par tmux.conf selon `aif-platform name`.
# Copie : OSC 52 (set-clipboard on, dans tmux.conf), qui garde les accents.

# Ctrl+Shift+O / E / X / N / B : Windows Terminal envoie ces séquences (actions sendInput),
# déclarées comme user-keys et liées aux actions aif-* de tmux.conf.
set -s user-keys[0] "\e[[tma-o"
set -s user-keys[1] "\e[[tma-e"
set -s user-keys[2] "\e[[tma-x"
set -s user-keys[3] "\e[[tma-n"
set -s user-keys[4] "\e[[tma-b"
bind -n User0 aif-split-right
bind -n User1 aif-split-below
bind -n User2 aif-kill-session
bind -n User3 aif-new-session
bind -n User4 aif-toggle-sidebar
