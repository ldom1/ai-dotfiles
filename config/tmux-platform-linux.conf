# Ubuntu natif (GNOME, Wayland seul, Ghostty). Chargé par tmux.conf selon `aif-platform name`.
# Copie : presse-papiers Wayland via aif-platform, et OSC 52 en plus (set-clipboard on, dans tmux.conf)
# pour les terminaux qui le gèrent et pour SSH. copy-pipe-and-cancel sans argument
# (liaisons de tmux.conf) envoie la sélection à copy-command.
set -s copy-command "~/ai-dotfiles/bin/aif-platform copy"

# Ghostty : couleurs 24 bits, touches étendues et OSC 52 déclarés à tmux.
set -as terminal-features ",xterm-ghostty:RGB:extkeys:clipboard"

# tmux ≥ 3.5 : touches étendues au format CSI u, pour distinguer Ctrl+Shift+O de Ctrl+O
# dans les terminaux qui l'envoient.
%if #{>=:#{version},3.5}
set -s extended-keys-format csi-u
%endif
