[package]
name = "aif-sidebar"
version = "0.1.0"
edition = "2024"
description = "tmux sidebar for Claude Code agents (ai-dotfiles). Reads `aif-agents list --json` and tmux only."
license = "MIT"
publish = false

[dependencies]
# ratatui réexporte crossterm 0.29 (ratatui::crossterm) : pas de dépendance directe.
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
anyhow = "1.0.104"
textwrap = { version = "0.16.4", default-features = false, features = ["unicode-width"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
